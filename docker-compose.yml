services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: kontrahent-backend
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      BACKGROUND_JOBS_ENABLED: "false"
      TELEGRAM_BOT_POLLING_ENABLED: "false"
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: ["npm", "run", "start:dev"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: kontrahent-frontend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}
      NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
